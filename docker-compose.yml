# nrv.net - environnement de dev
# api : http://localhost:8080 | front : http://localhost:8081 | adminer : http://localhost:8082

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-nrv}
      MARIADB_USER: ${DB_USER:-nrv}
      MARIADB_PASSWORD: ${DB_PASSWORD:-nrv}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      # le schema est joue au premier demarrage
      - ./sql:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build: ./docker/php
    restart: unless-stopped
    working_dir: /var/www/api
    env_file:
      - .env
    volumes:
      - ./api:/var/www/api
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/api:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  front:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./front/public:/usr/share/nginx/html:ro
      - ./docker/nginx/front.conf:/etc/nginx/conf.d/default.conf:ro

  # compile le scss en continu (optionnel : docker compose --profile dev up)
  sass:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /front
    volumes:
      - ./front:/front
    command: sh -c "npm install && npm run watch"

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db-data:
