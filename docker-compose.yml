# nrv.net - environnement de dev
# sur fedora / selinux, le :z autorise les conteneurs a lire les dossiers montes
# api : http://localhost:8080 | front : http://localhost:8081 | adminer : http://localhost:8082
# les ports se changent dans le .env (utile sur docketu si un port est deja pris)

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-nrv}
      MARIADB_USER: ${DB_USER:-nrv}
      MARIADB_PASSWORD: ${DB_PASSWORD:-nrv}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      # le schema est joue au premier demarrage
      - ./sql:/docker-entrypoint-initdb.d:ro,z
      - db-data:/var/lib/mysql
    ports:
      # base accessible seulement depuis la machine elle-meme
      - "127.0.0.1:${DB_PORT_HOTE:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build: ./docker/php
    restart: unless-stopped
    working_dir: /var/www/api
    env_file:
      - .env
    volumes:
      - ./api:/var/www/api:z
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./api:/var/www/api:ro,z
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - php

  front:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8081}:80"
    volumes:
      - ./front/public:/usr/share/nginx/html:ro,z
      - ./docker/nginx/front.conf:/etc/nginx/conf.d/default.conf:ro,z

  # compile le scss en continu (optionnel : docker compose --profile dev up)
  sass:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /front
    volumes:
      - ./front:/front:z
    command: sh -c "npm install && npm run watch"

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db-data:
