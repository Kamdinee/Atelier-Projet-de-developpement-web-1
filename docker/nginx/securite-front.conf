# en-tetes de securite du front (inclus dans front.conf)
# csp : scripts, styles et images seulement depuis le site ; api sur le port 8080 ; videos youtube
# 'unsafe-eval' est requis par Handlebars.compile() qui compile les templates dans le navigateur
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' $scheme://$host:8080; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
