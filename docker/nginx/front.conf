# site statique du front
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # pas de cache sur les templates en dev
    location /templates/ {
        add_header Cache-Control "no-store";
    }
}
