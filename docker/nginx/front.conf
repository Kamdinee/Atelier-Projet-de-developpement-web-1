# site statique du front
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/securite-front.conf;

    # le navigateur revalide chaque fichier (reponse 304 s'il n'a pas change) :
    # apres une mise a jour, personne ne garde une ancienne page melangee aux nouveaux scripts
    location / {
        include /etc/nginx/securite-front.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # templates : jamais en cache
    location /templates/ {
        include /etc/nginx/securite-front.conf;
        add_header Cache-Control "no-store";
    }
}
