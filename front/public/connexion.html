<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Nancy Rock Vibration 2027</title>
    <meta name="description" content="Connexion à votre compte NRV.net pour commander vos billets">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <a class="lien-evitement" href="#contenu">Aller au contenu</a>

    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__logo" href="index.html">NRV<span>.net</span></a>
            <nav class="nav" aria-label="Principale">
                <ul class="nav__liste">
                    <li><a class="nav__lien" href="index.html">Programme</a></li>
                    <li><a class="nav__lien" id="lien-compte" href="connexion.html" aria-current="page">Connexion</a></li>
                </ul>
            </nav>
            <a class="badge-panier" href="panier.html">
                Panier <span class="badge-panier__nombre" id="panier-nombre">0</span>
            </a>
        </div>
    </header>

    <main id="contenu" class="page-compte">
        <h1>Connexion</h1>
        <p class="page-compte__intro">Connectez-vous pour commander vos billets et les retrouver ensuite.</p>

        <form class="formulaire" id="form-compte" action="#" method="post">
            <div class="champ">
                <label for="email">Adresse email</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="180" required aria-describedby="email-erreur">
                <p class="champ-erreur" id="email-erreur" hidden></p>
            </div>
            <div class="champ">
                <label for="mot_de_passe">Mot de passe</label>
                <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="current-password" maxlength="255" required aria-describedby="mot_de_passe-erreur">
                <p class="champ-erreur" id="mot_de_passe-erreur" hidden></p>
            </div>
            <p class="formulaire__message" id="message-formulaire" role="alert" hidden></p>
            <button class="btn" type="submit">Se connecter</button>
        </form>

        <p class="page-compte__lien">Pas encore de compte ? <a id="lien-autre" href="inscription.html">Créer un compte</a></p>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <p>Nancy Rock Vibration · 4 au 17 juin 2027 · Nancy</p>
            <p>Atelier BUT 3 informatique - IUT Nancy-Charlemagne</p>
        </div>
    </footer>

    <div class="toast" role="status" aria-live="polite" hidden></div>

    <script src="js/config.js"></script>
    <script type="module" src="js/connexion.js"></script>
</body>
</html>
