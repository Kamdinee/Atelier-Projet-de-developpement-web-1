<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__logo" href="index.html">NRV<span>.net</span></a>
            <nav class="nav" aria-label="Principale">
                <ul class="nav__liste">
                    <li><a class="nav__lien" href="index.html" aria-current="page">Programme</a></li>

    <main id="contenu">
        <h1>Programme du festival</h1>

        <!-- page provisoire : la grille sera remplie par fetch + handlebars a l'etape 3 -->
        <p id="etat-api" class="message-vide">Vérification de l'API...</p>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <p>Nancy Rock Vibration 2027</p>
            <p>Atelier BUT 3 informatique - IUT Nancy-Charlemagne</p>
        </div>

    <div class="toast" role="status" aria-live="polite" hidden></div>

    <script src="js/config.js"></script>
    <script>
        // test simple : l'api repond-elle ?
        const api = window.NRV_CONFIG.apiUrl;
        fetch(api + '/')
            .then((reponse) => reponse.json())
            .then((data) => {
                document.getElementById('etat-api').textContent = 'API connectée : ' + data.nom + ' (' + api + ')';
            })
            .catch(() => {
                document.getElementById('etat-api').textContent = "L'API ne répond pas sur " + api;
            });
    </script>
